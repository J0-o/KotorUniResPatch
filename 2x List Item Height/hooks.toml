# Inventory item-entry constructor row height. The callback writes either the
# vanilla value below 1080p or the adjusted 2x value, then patches the shared
# item-entry visual constants before SetExtent runs.
[[hooks]]
address = 0x006B4FA5
type = "detour"
function = "setInventoryItemRowHeight"
original_bytes = [0xC7, 0x44, 0x24, 0x1C, 0x38, 0x00, 0x00, 0x00]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+28"
type = "pointer"

