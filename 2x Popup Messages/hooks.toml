# Scale selected popup dialog panels after StopLoadFromLayout has populated the
# root and named children, but before these constructors cache root dimensions.

# XP/item/status quick-message root panels are applied through SetRect at
# 0x0040A5A0. Persistent icon/text labels are left to the game.
[[hooks]]
address = 0x0040A5A0
type = "detour"
function = "scaleStatusSummarySetRect"
original_bytes = [0x83, 0xEC, 0x10, 0x8B, 0x44, 0x24, 0x14]
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

[[hooks.parameters]]
source = "esp+4"
type = "pointer"

