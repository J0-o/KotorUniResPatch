# Keep the top dialogue bar at least 100 pixels tall.
[[hooks]]
address = 0x006A7502
type = "replace"
original_bytes = [0x89, 0x9E, 0x80, 0x00, 0x00, 0x00]
replacement_bytes = [
    0x83, 0xF8, 0x64,                   # Compare the bar height with 100.
    0x7D, 0x05,                         # Skip the clamp if the bar is already tall enough.
    0xB8, 0x64, 0x00, 0x00, 0x00,       # Raise the bar height to 100.
    0x89, 0x9E, 0x80, 0x00, 0x00, 0x00  # Continue with the original top bar write.
]

# Keep the bottom dialogue bar at least 100 pixels tall.
[[hooks]]
address = 0x006A7592
type = "replace"
original_bytes = [0x89, 0x5E, 0x78, 0x0F, 0xBF, 0x4F, 0x6E]
replacement_bytes = [
    0x83, 0xF8, 0x64,                   # Compare the bar height with 100.
    0x7D, 0x05,                         # Skip the clamp if the bar is already tall enough.
    0xB8, 0x64, 0x00, 0x00, 0x00,       # Raise the bar height to 100.
    0x89, 0x5E, 0x78,                   # Continue with the original bottom bar write.
    0x0F, 0xBF, 0x4F, 0x6E              # Continue with the original dialogue height read.
]

# Keep dialogue choices inside the visible bottom bar.
[[hooks]]
address = 0x006A7CA0
type = "replace"
original_bytes = [
    0x83, 0xEC, 0x10,                   # Reserve stack space.
    0x8B, 0x44, 0x24, 0x14,             # Load the incoming dialogue choice rectangle.
    0x56,                               # Save the current register.
    0x50,                               # Pass the incoming rectangle.
    0x8B, 0xF1,                         # Save the dialogue choice owner.
    0xE8, 0xF0, 0x28, 0xD6, 0xFF        # Call the original rectangle setter.
]
replacement_bytes = [
    0x83, 0xEC, 0x10,                   # Reserve stack space.
    0x8B, 0x44, 0x24, 0x14,             # Load the incoming dialogue choice rectangle.
    0x56,                               # Save the current register.
    0x8B, 0xF1,                         # Save the dialogue choice owner.
    0x83, 0x78, 0x0C, 0x64,             # Check whether the choice list is tall enough to clamp.
    0x7C, 0x12,                         # Skip the clamp for short choice lists.
    0x8B, 0x4E, 0x18,                   # Load the dialogue window.
    0x0F, 0xBF, 0x49, 0x6E,             # Read the bottom bar height.
    0x2B, 0x48, 0x0C,                   # Find the highest safe top position.
    0x39, 0x48, 0x04,                   # Check whether the choices start too low.
    0x7E, 0x03,                         # Keep the current top if it is already visible.
    0x89, 0x48, 0x04,                   # Move the choices into the visible bar.
    0x8B, 0xCE,                         # Restore the dialogue choice owner.
    0x50,                               # Pass the adjusted rectangle.
    0xBA, 0xA0, 0xA5, 0x40, 0x00,       # Load the original rectangle setter.
    0xFF, 0xD2                          # Call the original rectangle setter.
]
