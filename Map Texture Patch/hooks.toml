# HUD minimap map draw-size fix.
#
# In FUN_0068AB10, the game copies the LBL_MAP rect to stack locals, computes
# left/top from the player map center, then calls the LBL_MAP set-rect method.
# Upscaled stacked minimap textures can make the dynamic map draw rect use the
# physical texture height, stretching the HUD minimap vertically. Force the
# copied map draw dimensions back to the logical atlas basis: 512x256.
#
# This hook is deliberately placed after the center-coordinate math and before
# the LBL_MAP set-rect call, so it can coexist with a separate hook at 0x0068ABB0.
[[hooks]]
address = 0x0068ABF8
type = "replace"
original_bytes = [0x8B, 0x96, 0x00, 0x5E, 0x00, 0x00]
replacement_bytes = [
    # mov dword ptr [esp+0x30], 512
    0xC7, 0x44, 0x24, 0x30, 0x00, 0x02, 0x00, 0x00,
    # mov dword ptr [esp+0x34], 256
    0xC7, 0x44, 0x24, 0x34, 0x00, 0x01, 0x00, 0x00,
    # original instruction: mov edx, [esi+0x5E00]
    0x8B, 0x96, 0x00, 0x5E, 0x00, 0x00
]
