# Keep the HUD minimap drawing from stretching when higher-resolution map textures are installed.
[[hooks]]
address = 0x0068ABF8
type = "replace"
original_bytes = [0x8B, 0x96, 0x00, 0x5E, 0x00, 0x00]
replacement_bytes = [
    # Set the map draw width to 512.
    0xC7, 0x44, 0x24, 0x30, 0x00, 0x02, 0x00, 0x00,
    # Set the map draw height to 256.
    0xC7, 0x44, 0x24, 0x34, 0x00, 0x01, 0x00, 0x00,
    # Continue with the original map control lookup.
    0x8B, 0x96, 0x00, 0x5E, 0x00, 0x00
]
