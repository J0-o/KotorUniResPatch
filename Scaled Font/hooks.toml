# Scale CAurFontInfo once, after the texture TXI metadata parser has completed.
# EDI is the live texture object and +0x38 is its CAurFontInfo pointer.
# This replaces the per-frame TextOutA/GUIString hooks and their pointer cache.
[[hooks]]
address = 0x00422CC1
type = "detour"
function = "scaleLoadedTextureMetadata"
original_bytes = [0x8B, 0x8C, 0x24, 0x14, 0x20, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "edi"
type = "pointer"

# CSWGuiManager::UpdateAllFonts reaches every live GUI string through this
# shared ReSetFont implementation. During a resolution refresh, scale each
# distinct font referenced by its live text-render object.
[[hooks]]
address = 0x00415D60
type = "detour"
function = "scaleResetGuiStringFont"
original_bytes = [0x83, 0xEC, 0x38, 0x56, 0x8B, 0xF1]
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"
