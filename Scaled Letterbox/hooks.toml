# Shared dialogue letterbox height.
#
# Vanilla derives dialogue letterbox height from screen width:
#   barHeight = round((screenHeight - round(screenWidth * scale)) * 0.5)
#
# That makes ultrawide modes produce very small bars. Use screen height
# directly instead:
#   barHeight = round(screenHeight / 6)
#   1280x720  -> 120px
#   1920x1080 -> 180px
#
# SetTop constructor path.
[[hooks]]
address = 0x006A74D2
type = "replace"
original_bytes = [
    0x0F, 0xBF, 0x4F, 0x6C,             # movsx ecx, word ptr [edi+0x6c]
    0x89, 0x4C, 0x24, 0x0C,             # mov [esp+0x0c], ecx
    0xDB, 0x44, 0x24, 0x0C,             # fild dword ptr [esp+0x0c]
    0xD8, 0x0D, 0x88, 0x57, 0x75, 0x00, # fmul dword ptr [0x00755788]
    0xE8, 0xA3, 0x39, 0x05, 0x00,       # call 0x006FAE8C
    0x0F, 0xBF, 0x57, 0x6E,             # movsx edx, word ptr [edi+0x6e]
    0x2B, 0xD0,                         # sub edx, eax
    0x89, 0x54, 0x24, 0x0C,             # mov [esp+0x0c], edx
    0xDB, 0x44, 0x24, 0x0C,             # fild dword ptr [esp+0x0c]
    0xD8, 0x0D, 0xAC, 0xE9, 0x73, 0x00, # fmul dword ptr [0x0073E9AC]
    0xE8, 0x8A, 0x39, 0x05, 0x00        # call 0x006FAE8C
]
replacement_bytes = [
    0x0F, 0xBF, 0x47, 0x6E,             # movsx eax, word ptr [edi+0x6e]
    0x83, 0xC0, 0x03,                   # add eax, 3
    0x51,                               # push ecx
    0x99,                               # cdq
    0xB9, 0x06, 0x00, 0x00, 0x00,       # mov ecx, 6
    0xF7, 0xF9,                         # idiv ecx
    0x59                                # pop ecx
]

