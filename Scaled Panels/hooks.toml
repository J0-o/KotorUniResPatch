# QORCPNL, QUICKPNL, LEVELUPPNL, and CUSTPNL are small independent root panels, not
# children of the main character/level-up panel roots. MenuScale intentionally
# ignores small roots, so scale these constructors after StopLoadFromLayout has
# populated the panel tree.
[[hooks]]
address = 0x006F0C4B
type = "detour"
function = "scaleQuickOrCustomPanel"
original_bytes = [0x8B, 0x86, 0xC0, 0x0B, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006EF9CC
type = "detour"
function = "scaleCustomPanel"
original_bytes = [0x68, 0x20, 0xF1, 0x6E, 0x00, 0x56]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006EEE46
type = "detour"
function = "scaleLevelUpPanel"
original_bytes = [0x8D, 0x4C, 0x24, 0x38, 0xC6, 0x44, 0x24, 0x4C, 0x06]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006F0607
type = "detour"
function = "scaleQuickPanel"
original_bytes = [0x68, 0x10, 0xFE, 0x6E, 0x00, 0x56]
exclude_from_restore = []

[[hooks.parameters]]
