# Shared centering dispatcher. The callback filters both the popup vtable and
# the constructor return address before scaling. The original function then
# centers the enlarged root against the active screen.
[[hooks]]
address = 0x0040A600
type = "detour"
function = "scaleCenteredPopup"
original_bytes = [0x8B, 0x51, 0x0C, 0x56, 0x8B, 0x71, 0x18]
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks.parameters]]
source = "esp+0"
type = "pointer"

# Bark and pause dialogs are scaled immediately after their own calls to the
# shared layout-finalizer. The bark root is also centered against the active
# screen width. Keeping these constructor-local hooks avoids owning the same
# engine hook as Scaled Menu.
[[hooks]]
address = 0x006A981F
type = "detour"
function = "scaleLayoutPopup"
original_bytes = [0x8D, 0x46, 0x04, 0x8B, 0x08]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006C04D7
type = "detour"
function = "scaleLayoutPopup"
original_bytes = [0x8B, 0x56, 0x08, 0x8B, 0x46, 0x04]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

