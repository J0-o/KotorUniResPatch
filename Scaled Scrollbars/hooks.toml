# Generic listbox scrollbar thickness fixed-base height scale.
#
# Listbox SetExtent at 0x0041BF80 loads the scrollbar child width from
# [listbox + 0x110]. Zero suppresses the scrollbar, so preserve that sentinel.
# At exactly 800x600, keep the vanilla width. For other resolutions and
# nonzero widths, avoid compounding previous relayouts by deriving the width
# from the 16px base template instead: 16 * screenHeight / 480.
[[hooks]]
address = 0x0041BF8B
type = "replace"
original_bytes = [0x8B, 0x9E, 0x10, 0x01, 0x00, 0x00, 0x8B, 0xD0, 0x57]
replacement_bytes = [
    0x9C,
    0x8B, 0x9E, 0x10, 0x01, 0x00, 0x00,
    0x85, 0xDB,
    0x74, 0x32,
    0x81, 0x3D, 0xD4, 0xD1, 0x78, 0x00, 0x20, 0x03, 0x00, 0x00,
    0x75, 0x0C,
    0x81, 0x3D, 0xD8, 0xD1, 0x78, 0x00, 0x58, 0x02, 0x00, 0x00,
    0x74, 0x1A,
    0x50, 0x51,
    0xB8, 0x10, 0x00, 0x00, 0x00,
    0x0F, 0xAF, 0x05, 0xD8, 0xD1, 0x78, 0x00,
    0xB9, 0xE0, 0x01, 0x00, 0x00,
    0x99,
    0xF7, 0xF9,
    0x8B, 0xD8,
    0x59, 0x58,
    0x9D,
    0x8B, 0xD0,
    0x57
]
